# =============================================================================
# Mosquitto configuration - DEVELOPMENT profile (Phase 0)
# -----------------------------------------------------------------------------
# WARNING: anonymous access is allowed here ON PURPOSE so that Phases 1-5 can
# be built quickly. The port is bound to 127.0.0.1 in docker-compose.yml.
# Phase 6 replaces this with:
#   - TLS listener on 8883 (server certificate signed by our own CA)
#   - per-device username/password (password_file)
#   - topic ACLs (acl_file): each ESP32 may publish only its own telemetry
#     and subscribe only to its own command topic
#   - plain 1883 listener disabled
# =============================================================================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

listener 1883
allow_anonymous true
