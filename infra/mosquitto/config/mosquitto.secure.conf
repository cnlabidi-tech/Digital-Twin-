# =============================================================================
# Mosquitto configuration - SECURE profile (Phase 6, default)
# -----------------------------------------------------------------------------
# Requires the secrets generated by:  npm run setup -w @twin/security
#   - TLS only (port 8883), TLS 1.2 minimum, server certificate from our CA
#   - no anonymous access: one username/password per client (hashed file)
#   - topic ACLs: each device confined to pipeline/v1/<its id>/...
#   - client id forced to the username: nobody can take over a device's session
# =============================================================================

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/mosquitto/passwd
acl_file /mosquitto/secrets/mosquitto/acl

listener 8883
protocol mqtt
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
use_username_as_clientid true

# Limits (basic flood protection at the broker)
max_packet_size 16384
max_inflight_messages 20
max_queued_messages 200
