; =============================================================================
; Pipeline twin - ESP32-S3 node firmware
;   pio run -e inlet -t upload       (ESP32 #1: pump, P1, F1)
;   pio run -e downstream -t upload  (ESP32 #2: P2, P3, F2)
;   pio device monitor               (serial console: status, cal ..., raw on)
; Secrets: npm run firmware-secrets -w @twin/security -- --ssid .. --wifi-pass .. --broker <PC IP>
; =============================================================================
[platformio]
default_envs = inlet, downstream

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    256dpi/MQTT@^2.5.2
    adafruit/Adafruit ADS1X15@^2.5.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; host unit tests live in test/host and are run with g++ (test/host/run.sh)
test_ignore = host

[env:inlet]
build_flags = ${env.build_flags} -DNODE_INLET '-DSECRETS_FILE="secrets_node_inlet.h"'

[env:downstream]
build_flags = ${env.build_flags} -DNODE_DOWNSTREAM '-DSECRETS_FILE="secrets_node_downstream.h"'
