# =============================================================================
# Pipeline Digital Twin - local stack
# -----------------------------------------------------------------------------
#   - mosquitto   : MQTT broker (ESP32s / emulator <-> platform)
#   - timescaledb : PostgreSQL + TimescaleDB (time-series storage)
#   - backend     : ingestion, twin, detection, control, API   (Phase 2+)
#   - emulator    : fake ESP32s - only with the "sim" profile   (Phase 1)
#
#   npm run setup -w @twin/security      # once: certificates, credentials, keys
#   docker compose up -d                 # platform only (real hardware)
#   docker compose --profile sim up -d   # platform + emulator
#
# SECURITY_MODE (in .env): secure (default: TLS 8883, auth, ACL, signatures,
# login) or dev (plain 1883 on localhost, anonymous, no login).
# =============================================================================
name: pipeline-twin

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: twin-mosquitto
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.${SECURITY_MODE:-secure}.conf"]
    ports:
      # dev profile: plain MQTT, localhost only
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      # secure profile: MQTT over TLS, reachable by the ESP32s on the LAN
      - "${MQTTS_PORT:-8883}:8883"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./secrets:/mosquitto/secrets:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # The broker process is up and listening (works for both profiles).
      test: ["CMD-SHELL", "nc -z localhost 8883 || nc -z localhost 1883"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: twin-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_twin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # SQL files in this folder run once, on first start with an empty volume.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: { context: ., dockerfile: docker/node.Dockerfile }
    image: pipeline-twin-node
    container_name: twin-backend
    restart: unless-stopped
    command: ["npm", "start", "-w", "@twin/backend"]
    env_file:
      - path: ./secrets/backend.env
        required: false
    environment:
      SECURITY_MODE: ${SECURITY_MODE:-secure}
      MQTT_HOST: mosquitto
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_twin}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - ./secrets:/run/secrets/twin:ro
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      mosquitto: { condition: service_healthy }
      timescaledb: { condition: service_healthy }

  emulator:
    profiles: ["sim"]
    image: pipeline-twin-node
    container_name: twin-emulator
    restart: unless-stopped
    command: ["npm", "start", "-w", "@twin/emulator"]
    env_file:
      - path: ./secrets/emulator.env
        required: false
    environment:
      SECURITY_MODE: ${SECURITY_MODE:-secure}
      MQTT_HOST: mosquitto
      EMU_API_HOST: 0.0.0.0
      EMU_API_PORT: 4100
    volumes:
      - ./secrets:/run/secrets/twin:ro
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      mosquitto: { condition: service_healthy }
      backend: { condition: service_started }

volumes:
  mosquitto-data:
  timescale-data:
