# =============================================================================
# Pipeline Digital Twin - local stack
# -----------------------------------------------------------------------------
#   - mosquitto   : MQTT broker (ESP32s / emulator <-> platform)
#   - timescaledb : PostgreSQL + TimescaleDB (time-series storage)
#   - backend     : ingestion, twin, detection, control, API   (Phase 2+)
#   - emulator    : fake ESP32s - only with the "sim" profile   (Phase 1)
#
#   docker compose up -d                 # platform only (real hardware)
#   docker compose --profile sim up -d   # platform + emulator
# =============================================================================
name: pipeline-twin

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: twin-mosquitto
    restart: unless-stopped
    ports:
      # Plain MQTT bound to localhost only (dev). TLS listener 8883 comes in Phase 6.
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # Publish to a test topic; succeeds only if the broker accepts connections.
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health/check", "-m", "ok", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: twin-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_twin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # SQL files in this folder run once, on first start with an empty volume.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: { context: ., dockerfile: docker/node.Dockerfile }
    image: pipeline-twin-node
    container_name: twin-backend
    restart: unless-stopped
    command: ["npm", "start", "-w", "@twin/backend"]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_twin}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      mosquitto: { condition: service_healthy }
      timescaledb: { condition: service_healthy }

  emulator:
    profiles: ["sim"]
    image: pipeline-twin-node
    container_name: twin-emulator
    restart: unless-stopped
    command: ["npm", "start", "-w", "@twin/emulator"]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      EMU_API_HOST: 0.0.0.0
      EMU_API_PORT: 4100
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      mosquitto: { condition: service_healthy }
      backend: { condition: service_started }

volumes:
  mosquitto-data:
  timescale-data:
